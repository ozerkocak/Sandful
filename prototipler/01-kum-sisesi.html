<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9c4a5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sandful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Sıcak, ışıklı bir atölye masası: üstte buzlu cam bilgi şeridi, ortada 3D kavanoz, altta ipucu. */
:root{--bg:#d9c4a5;--ink:#4a3826;--ink2:#86705a;--glass:rgba(255,251,244,.62);--glassLine:rgba(255,255,255,.75);--gold:#f2b53c;--amber:#e3803f;
 --font:"Nunito",ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 46%,rgba(60,38,18,0) 55%,rgba(60,38,18,.26) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.frost{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glassLine);box-shadow:0 6px 18px rgba(74,56,38,.12),inset 0 1px 0 rgba(255,255,255,.7)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safeT) + 10px) 14px 0;pointer-events:none}
.row1{display:flex;align-items:center;gap:10px;height:42px}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;display:flex;justify-content:center}
#title span{padding:8px 16px;border-radius:21px;font-weight:900;font-size:17px;letter-spacing:.2px}
#title b{color:var(--amber);font-weight:900;margin-right:6px}
.row2{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 12px 18px 14px;border-radius:18px}
#pbar{position:relative;flex:1;height:12px;border-radius:7px;background:rgba(74,56,38,.14);box-shadow:inset 0 1px 2px rgba(74,56,38,.2)}
#pfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:linear-gradient(90deg,#f6cd72,#e98b45);box-shadow:0 0 10px rgba(240,170,70,.55),inset 0 1px 0 rgba(255,255,255,.55);transition:width .35s}
.mk{position:absolute;top:-4px;height:20px;border-left:2px solid rgba(255,255,255,.95)}
.mk::after{content:"★";position:absolute;left:-7px;top:18px;font-size:12px;line-height:1;color:rgba(134,112,90,.75)}
.mk.on::after{color:var(--gold);text-shadow:0 0 6px rgba(242,181,60,.8)}
#pct{min-width:70px;text-align:right;font-weight:900;font-size:27px;font-variant-numeric:tabular-nums;line-height:1}
#queue{display:flex;gap:4px;margin-top:10px;height:14px;padding:0 2px}
.seg{position:relative;border-radius:7px;overflow:hidden;min-width:10px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.seg::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.4px) 0 0/4px 4px,radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.4px) 2px 2px/5px 5px}
.seg .f{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,251,244,.82)}
.seg.cur,.chip.cur{outline:2px solid rgba(74,56,38,.6);outline-offset:1px}
.chip{flex:0 0 22px;display:grid;place-items:center;font-size:12px;border-radius:7px;background:rgba(255,251,244,.85)}
.chip.done{opacity:.35}
#toast{position:fixed;left:0;right:0;top:35%;text-align:center;font-weight:900;font-size:25px;color:#fff;text-shadow:0 2px 0 rgba(74,56,38,.35),0 0 20px rgba(242,181,60,.85);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#toast.show{opacity:1;transform:none}
#banner{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#banner.show{opacity:1;transform:none}
#banner .bt{font-weight:900;font-size:36px;color:#fff;letter-spacing:.3px;text-shadow:0 3px 0 rgba(74,56,38,.28),0 0 26px rgba(74,56,38,.3)}
#banner .bs{margin-top:2px;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(74,56,38,.55)}
#hint{position:fixed;left:16px;right:16px;bottom:calc(var(--safeB) + 14px);text-align:center;font-size:14.5px;font-weight:700;line-height:1.35;color:var(--ink2);pointer-events:none;text-wrap:balance}
#hand{position:fixed;left:50%;bottom:calc(var(--safeB) + 78px);margin-left:-21px;font-size:42px;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 4px 6px rgba(74,56,38,.3))}
#hand.show{opacity:1;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-80px) rotate(-8deg)}50%{transform:translateX(80px) rotate(8deg)}}
#bPuff{position:fixed;right:14px;bottom:calc(var(--safeB) + 62px);height:50px;padding:0 16px;border-radius:25px;font-size:20px;display:none;pointer-events:auto}
#bPuff b{font-size:17px;font-weight:900}
#bPuff.off{opacity:.4}
#bUndo{position:fixed;left:14px;bottom:calc(var(--safeB) + 62px);height:50px;padding:0 16px;border-radius:25px;font-size:21px;font-weight:900;display:none;pointer-events:auto}
#bUndo b{font-size:17px;font-weight:900;margin-left:2px}
#bUndo.show{display:block}
#gfxErr{position:fixed;left:24px;right:24px;top:45%;text-align:center;font-weight:800;color:var(--ink2);display:none}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--safeB) + 12px);border-radius:26px;padding:14px 16px 14px;transform:translateY(140%);transition:transform .55s cubic-bezier(.2,.9,.3,1.12);text-align:center;background:rgba(255,251,244,.86)}
.sheet.show{transform:none}
.sheet h2{margin:0;font-size:19px;font-weight:900}
.sheet .big{font-size:40px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.sheet .big small{font-size:14px;font-weight:800;color:var(--ink2)}
.stars{margin:0 0 2px}
.stars span{display:inline-block;font-size:38px;color:rgba(134,112,90,.25);transform:scale(.5);transition:transform .4s cubic-bezier(.3,1.9,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1);text-shadow:0 0 16px rgba(242,181,60,.75)}
.sheet p{margin:2px 0 10px;color:var(--ink2);font-size:13.5px;font-weight:700;line-height:1.3}
.btns{display:flex;gap:10px}
.btn{flex:1;height:50px;border-radius:17px;font-weight:900;font-size:17px}
.btn.pri{background:linear-gradient(180deg,#f5ab60,#e07c40);color:#fff;box-shadow:0 4px 0 #b65f2d,0 8px 16px rgba(224,124,64,.3)}
.btn.sec{background:#f2e7d7;box-shadow:0 4px 0 #dccab0}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45}
#raf{position:fixed;inset:0;background:radial-gradient(130% 85% at 50% 18%,#f8eedd 0%,#e4cfae 100%);padding:calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 16px);overflow-y:auto;touch-action:pan-y;display:none}
#raf.show{display:block}
#raf h1{margin:4px 0 0;font-size:30px;font-weight:900;text-align:center}
#raf .sub{text-align:center;color:var(--ink2);font-weight:800;font-size:14px;margin-bottom:16px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 6px;position:relative;margin-bottom:24px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:12px;border-radius:4px;background:linear-gradient(#d0a275,#a67a50);box-shadow:0 7px 12px rgba(74,56,38,.22)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:4px;min-width:0}
.jar{width:82px;height:100px;display:grid;place-items:end center}
.jar img{width:82px;height:100px;object-fit:cover;border-radius:12px;filter:drop-shadow(0 3px 4px rgba(74,56,38,.25))}
.jar .empty{width:60px;height:76px;border-radius:12px 12px 18px 18px;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--ink2)}
.slot .nm{font-size:12px;font-weight:900}
.slot .st{font-size:13px;color:var(--gold);letter-spacing:1px}
.slot .st i{font-style:normal;color:#d9cab4}
.slot.lock{opacity:.5}
.slot.next .empty{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,60,.25)}
.set{display:flex;gap:10px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
.set button{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,251,244,.85);font-weight:800;font-size:14px}
#rafClose{display:block;margin:6px auto 0;width:220px}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#hand.show{animation:none}.sheet,.stars span,#toast,#banner,#pfill{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud">
  <div class="row1"><button id="bRaf" class="ib frost" aria-label="Raf"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div id="title"><span class="frost"></span></div><button id="bRe" class="ib frost" aria-label="Baştan"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button></div>
  <div class="row2 frost"><div id="pbar"><div id="pfill"></div><i class="mk" id="m1"></i><i class="mk" id="m2"></i><i class="mk" id="m3"></i></div><div id="pct">%0</div></div>
  <div id="queue"></div>
</div>
<div id="banner"><div class="bt"></div><div class="bs"></div></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="hand">👆</div>
<div id="gfxErr">Bu cihazda 3D grafik açılamadı.</div>
<button id="bPuff" class="frost">💨 <b>3</b></button>
<button id="bUndo" class="frost" aria-label="Geri al">↶<b>1</b></button>
<div id="result" class="sheet frost">
  <h2 id="rTitle"></h2>
  <div class="big" id="rPct"></div>
  <div class="stars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
  <p id="rMsg"></p>
  <div class="btns"><button class="btn sec" id="rAgain">Tekrar</button><button class="btn pri" id="rNext">Sonraki</button></div>
</div>
<div id="raf">
  <h1 id="rafH">Rafım</h1>
  <div class="sub" id="rafSub"></div>
  <div id="shelves"></div>
  <div class="set"><button id="sSnd"></button><button id="sMuz"></button><button id="sKum"></button><button id="sHap"></button><button id="sLang"></button></div>
  <button class="btn sec" id="rafClose">Devam</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const NV=384,YT=2.2;          // kum dokusu: 256 sütun × 384 satır
const TOL=3*CELL;let SCALE=20*CELL;
const GRAVW=14,FLOWK=2.25e-4,SIG=2.2,FUNY=2.38; // akış dilimlerinin yerçekimi, akış katsayısı, döküş izi (sütun), huni ucu
const BEAT=.5,GAIN=1.25,RMAX=88;
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CPX=window.Capacitor,NATIVE=!!(CPX&&CPX.isNativePlatform&&CPX.isNativePlatform()),PLG=(NATIVE&&CPX.Plugins)||{};

let seed=1;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function gauss(){return Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};

// ───────── Kayıt ─────────
const SKEY='kumSisesi.v3';
let SAVE={lv:{},snd:true,hap:true,seen:false,kum6:0,muz:true};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){const v=JSON.stringify(SAVE);try{localStorage.setItem(SKEY,v);}catch(e){}if(PLG.Preferences)PLG.Preferences.set({key:SKEY,value:v}).catch(()=>{});}

// ───────── Dil ─────────
// Oyun global: telefon Türkçeyse Türkçe, değilse İngilizce; rafta "Dil" düğmesiyle değişir.
// Metinler kodda Türkçe yazılır, EN sözlüğü çevirir. {0}, {1}: yerine konan değerler.
const EN={
 'Kumsal':'Beach','Tepe':'Hill','Koy':'Cove','Tekne':'Boat','Dağlar':'Mountains','Vadi':'Valley','Çöl':'Desert','Gün batımı':'Sunset','Göl':'Lake','Gece':'Night',

 'Nehri ortaya dök, yeşili kenarlara yığ.':'Pour the river in the middle and pile the green on the sides.',
 'İki kumul yap. Kaktüs birinci kumulun tepesine, güneş göğün ortasına.':'Make two dunes. The cactus goes on top of the first dune, the sun in the middle of the sky.',

 'Toprağı sağa yığ, göl solda düz kalsın. Kuğu göle, ağaç tepeye.':'Pile the soil on the right and keep the lake flat on the left. The swan goes on the lake, the tree on the hill.',
 'Önce dağlar, sonra gece. Yıldız ve ay gökyüzünün içinde asılı kalsın.':'Mountains first, then the night. The star and the moon hang inside the sky.',
 'Bölüm {0}':'Level {0}',' · süslü':' · with decorations','Akış {0}':'Flow {0}','Kusursuz katman!':'Perfect layer!','Güzel katman':'Nice layer',
 'Yerine getir, parmağını kaldır':'Move it into place, lift your finger','Tam yerinde! ✨':'Perfect spot! ✨','Biraz kaydı':'A little off',
 'Şişe hazır':'Jar finished','Güzel bir şişe':'A lovely jar','Çok güzel!':'Beautiful!','Kusursuz şişe!':'Perfect jar!','benzerlik':'match',
 'Bir yıldız için {0} gerekli. Kumu silik çizgilere yakın dök.':'You need {0} for one star. Pour the sand close to the faint lines.',
 'İki yıldız için {0}. Parlayan bölgeye dök, ses kesilirse yer değiştir.':'Two stars need {0}. Pour into the glowing area; if the music stops, move.',
 'Üçüncü yıldız için süsler halkanın içine düşmeli.':'For the third star, drop the decorations inside their rings.',
 'Üçüncü yıldız için {0}.':'The third star needs {0}.','Rafına eklendi.':'Added to your shelf.',' Süs: {0}/{1}.':' Decorations: {0}/{1}.',
 'Raf':'Shelf','Sonraki':'Next','Tekrar':'Again','Devam':'Continue','Rafım':'My Shelf','Baştan':'Restart',
 'Ses: {0}':'Sound: {0}','Müzik: {0}':'Music: {0}','Kum sesi: {0}':'Sand sound: {0}','Titreşim: {0}':'Haptics: {0}','Dil: {0}':'Language: {0}','açık':'on','kapalı':'off',
 'Geri alındı':'Undone','Geri al':'Undo','Tıpırtı':'Patter','Kadife':'Velvet','İnce':'Fine','Bu cihazda 3D grafik açılamadı.':'3D graphics could not start on this device.'};
let LANG='en';
const langNow=()=>SAVE.lang||((navigator.language||'en').toLowerCase().startsWith('tr')?'tr':'en');
function t(s,...a){let r=LANG==='en'&&EN[s]!=null?EN[s]:s;a.forEach((v,i)=>{r=r.split('{'+i+'}').join(v);});return r;}
const pctS=p=>LANG==='tr'?'%'+p:p+'%';

const PAL={kum:'#e8c483',deniz:'#4d93cf',gok:'#b4dcf0',toprak:'#8f6343',cimen:'#86c063',turuncu:'#ef9d55',pembe:'#ec93aa',mor:'#9175c4',
 dag:'#958fb0',kar:'#f3f4f8',nehir:'#5cb3df',koyuDeniz:'#336fa8',sari:'#f3d66a',colKumu:'#e6ab66',acikSari:'#f8e4ab',lacivert:'#414d8c',

// süsler: dünya biriminde boyut, ikon (sıra çubuğu için) ve tuvale çizim
// Işıldayan kumlar karanlıkta parlar (finalde ışık söner). Canlanan finalde su kumu parıldar, gece kumunda yıldızlar kırpışır.
const GLOW={isilti:1,kuzey:.9},FX_SU=new Set(['deniz','koyuDeniz','nehir','turkuaz']),FX_YILDIZ=new Set(['gece','geceMavi']);
const DEC={
 tekne:{e:'⛵',w:.3,h:.27},kaktus:{e:'🌵',w:.18,h:.29},gunes:{e:'☀️',w:.24,h:.24},kugu:{e:'🦢',w:.26,h:.22},
 agac:{e:'🌳',w:.24,h:.32},ay:{e:'🌙',w:.18,h:.21},yildiz:{e:'⭐',w:.16,h:.16}};

// Katman üst sınırları u∈[0,1] (camın sol→sağ) için dolgu yüksekliğinin oranı. Eğim ≤ 0,5 kalmalı (kum 34°'de durur).
const flat=h=>()=>h, lin=(a,b)=>u=>a+(b-a)*u;
const tri=(c,h,k)=>u=>h-k*Math.abs(u-c);
const mx=(...f)=>u=>Math.max(...f.map(q=>q(u)));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const dag5=mx(flat(.12),tri(.33,.42,.5),tri(.74,.36,.5));

const nehir6=mx(flat(.12),tri(.5,.26,.5));
const tepe9=mx(flat(.1),tri(.75,.42,.5));
const yay=h=>u=>h-.07*Math.cos(6.2832*(u-.5)); // ortası çukur yay

const LEVELS=[
 {ad:'Kumsal',sekil:'kavanoz',ortam:'deniz',akis:520,kok:64,ipucu:'Basılı tut: kum akar. Bırak: durur. Sürükleyerek huniyi gezdir, kumu silik çizgilere göre düz yay.',
  katman:[['kum',flat(.34)],['deniz',flat(.68)],['gok',flat(1)]]},
 {ad:'Tepe',sekil:'kavanoz',ortam:'ruzgar',akis:540,kok:62,ipucu:'Sağda biraz bekle: kum yığılır, tepe olur.',
  katman:[['toprak',flat(.2)],['cimen',mx(flat(.27),tri(.62,.52,.5))],['gok',flat(1)]]},
 {ad:'Koy',sekil:'kase',ortam:'deniz',akis:560,kok:65,ipucu:'Kumu sağa yığ, deniz solda derin kalsın.',
  katman:[['kum',lin(.08,.46)],['deniz',flat(.56)],['turuncu',flat(.8)],['pembe',flat(1)]]},
 {ad:'Tekne',sekil:'kavanoz',ortam:'deniz',akis:560,kok:60,ipucu:'Kumsal solda yükselir. Deniz bitince tekne gelir: halkanın üstüne getir, parmağını kaldır.',
  katman:[['kum',lin(.42,.12)],['deniz',flat(.6)],['gok',flat(1)]],sus:[{id:'tekne',katman:1,oran:1,u:.62}]},

// katman yığını işlemleri

// ───────── Kum fiziği ─────────
// Düşen her kum payı yokuştan aşağı yuvarlanır ve sığabildiği ilk yerde kalır: yüzey hiçbir an 34°'yi aşmaz,
// iğne ya da kule oluşmaz, kesitler yumuşak eğriler olur. Eğim her payda biraz değişir, yamaç doğal pürüzlü görünür.
// Payın yuvarlandığı yol, görüntüde yamaçtan kayan taneler olarak çizilir.
// Tutun-kay (gerçek kum gibi): düşen pay 34-39° arası bir eğimde durabilir, yamaç yavaş yavaş dikleşir.
// Bir yerde eğim kritik açıyı (38°) geçince oradan aşağı ince bir tabaka birkaç kare içinde kayar ve yamaç ~31,5°'ye iner (küçük çığ).

// üst uçtaki yamaç da kritik açıya yakınsa kayma yukarı genişler (yamaçta basamak kalmaz).

 for(let i=avs.length-1;i>=0;i--){const a=avs[i],s=a.s;let moved=0;if(a.lo==null){a.lo=a.c;a.hi=a.c;}
  for(let g=0;g<4;g++){const u=a.lo-s;if(u<0||u>=NC||!valid[u]||Math.abs(u-a.c)>30||topY[u]-topY[a.lo]<=TCRIT*.92)break;a.lo=u;}

   else if((p-a.hi)*s>=0)break;}

  if((a.t>.08&&moved<4e-5)||a.t>.5)avs.splice(i,1);}}

function emit(){

// Benzerlik: her sütunda her katmanın üst çizgisi silik çizgiye ne kadar uzak? TOL'a kadar tam puan, TOL+SCALE'de sıfır.

   else{for(let q=0;q<ncol;q++){const lo=q?tTop[q-1][c]:floorY[c],hi=q===ncol-1?1e9:tTop[q][c],ov=Math.min(y+h,hi)-Math.max(y,lo);if(ov>0)acc[q]+=ov;}} // süs tarafsız: kapladığı yükseklik hedefteki katmana sayılır

let TS=1,last=performance.now(),acc=0,AUTO=null,FREEZE=false;
function frame(now){requestAnimationFrame(frame);if(sndJob)sndJob.run(state==='pour'||state==='hold'?4:10);const dt=Math.min(.1,(now-last)/1000);last=now;
 if(TS>0&&!document.hidden&&L){acc+=dt*TS;let n=0;while(acc>=DT&&n<4){step();acc-=DT;n++;}if(n===4)acc=0;}
 if(L&&state!=='menu'&&!FREEZE){gfxFrame(now);updateHud();}}

// ───────── Botlar (zorluk ayarı için) ─────────
// kusursuz: en çok eksik olan yere gider, orada döker, eksik kalmayınca durur. insan: süpürür, eksik gördüğü yerde döker, geç algılar.
// dağınık: hep döker, büyük algı hatası. süpürücü: hep döker, hiç düşünmeden sağa sola. dokunmayan: ortada basılı tutar.
function deficits(k,pn){const out=new Float32Array(NC),fl=new Float32Array(NC),raw=new Float32Array(NC);
 const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28],am=pn?[gauss()*pn,gauss()*pn,gauss()*pn]:[0,0,0];
 for(const s of slices){const c=colOf(s.x);for(let q=-3;q<=3;q++){const cc=c+q;if(cc>=0&&cc<NC)fl[cc]+=s.a/DX/7;}}
 for(let c=0;c<NC;c++)raw[c]=valid[c]?(tTop[k][c]-topY[c]-fl[c])/CELL+am[0]*Math.sin(c*.025+ph[0])+am[1]*Math.sin(c*.06+ph[1])+am[2]*Math.sin(c*.12+ph[2]):-99;
 for(let c=0;c<NC;c++){let s=0,n=0;for(let q=-5;q<=5;q++){const cc=c+q;if(cc>=0&&cc<NC&&valid[cc]){s+=raw[cc];n++;}}out[c]=n?s/n:-99;}
 return out;}
function botThink(pf,B){const lim=rMouth-.04;
 if(state==='hold'){pouring=false;if(pf==='dokunmayan'||pf==='supurucu'){if(holdT>.4)releaseDecor();return;}
  const P2={kusursuz:[3,0],insan:[1.6,.03],daginik:[1.4,.09]}[pf];if(B.hold!==decor.rec){B.hold=decor.rec;B.haim=decor.rec.zx+gauss()*P2[1];}
  nozT=noz+clamp(B.haim-noz,-P2[0]*DT,P2[0]*DT);if(Math.abs(noz-B.haim)<.01&&holdT>.4)releaseDecor();return;}
 if(pf==='dokunmayan'){pouring=true;nozT=0;return;}
 if(pf==='supurucu'){pouring=true;nozT=noz+B.dir*1.2*DT;if(nozT>=lim)B.dir=-1;if(nozT<=-lim)B.dir=1;return;}
 const it=queue[qi];if(!it||it.t!=='kum'){pouring=false;return;}
 if(pf==='kusursuz'){if(T>=B.next){B.next=T+DT*3;B.def=deficits(it.c,0);let bx=-1;for(let c=0;c<NC;c++)if(B.def[c]>-90&&(bx<0||B.def[c]>B.def[bx]))bx=c;B.tx=xOf(bx);B.best=B.def[bx];}
  nozT=noz+clamp(B.tx-noz,-3*DT,3*DT);const here=B.def[colOf(noz)];pouring=Math.abs(noz-B.tx)<DX*3||here>.6;if(B.best<.3)pouring=Math.abs(noz-B.tx)<DX*3;return;}
 const P={insan:{vb:1.33,vmax:2.1,vmin:.25,re:.15,bn:.04,sn:.3,slow:.8,pn:4,thr:.8},daginik:{vb:1.19,vmax:1.68,vmin:.42,re:.35,bn:.13,sn:.6,slow:.35,pn:10,thr:-99}}[pf];
 if(T>=B.next){B.next=T+P.re+DT;B.def=deficits(it.c,P.pn);let a=-1,b=-1,bx=0;
  for(let c=0;c<NC;c++){if(B.def[c]>.7){if(a<0)a=c;b=c;}if(B.def[c]>B.def[bx])bx=c;}
  if(a<0)a=b=bx;let sm=0,sn=0;for(let c=a;c<=b;c++)if(B.def[c]>0){sm+=B.def[c];sn++;}B.mean=sn?sm/sn:0;
  B.a=xOf(a)+gauss()*P.bn;B.b=Math.max(B.a,xOf(b)+gauss()*P.bn);B.allLow=B.def[bx]<P.thr;}
 const d=B.def[colOf(noz)];
 let v=d<=0?P.vmax:clamp(P.vb*Math.pow((B.mean+2)/(d+2),P.slow),P.vmin,P.vmax);v*=Math.max(.3,1+gauss()*P.sn*.3);
 if(noz<B.a-.01)B.dir=1;else if(noz>B.b+.01)B.dir=-1;else if(B.dir>0&&noz>=B.b)B.dir=-1;else if(B.dir<0&&noz<=B.a)B.dir=1;
 nozT=noz+B.dir*v*DT;pouring=d>P.thr||B.allLow;}
function runBot(pf,n,sd){startLevel(n,{bot:true,seed:sd||1});beginPour();pourStart=0;
 const B={dir:1,next:0};let k=0;while(state!=='result'&&k<60*240){botThink(pf,B);step();k++;}
 const res={bot:pf,bolum:n+1,yuzde:+pct.toFixed(1),yildiz:starsFor(pct),sus:decorList.map(d=>d.ok?'✓':'✗').join(''),sn:+(k*DT).toFixed(1)};
 BOT=false;pouring=false;return res;}

window.__game={setTS:v=>{TS=v;},sim:ms=>{const n=Math.round(ms/1000/DT);for(let k=0;k<n;k++)step();},
 state:()=>({state,level:LV,pct:+pct.toFixed(1),stars:starsFor(pct),qi,ql:queue.length,slices:slices.length,noz:+noz.toFixed(3),onTarget,streakLvl,puffs,gfx:!!RD}),
 autoplay:pf=>{AUTO=pf?{pf,B:{dir:1,next:0}}:null;},tune:o=>{if(o.SCALE!=null)SCALE=o.SCALE*CELL;if(o.TH)STAR_TH=o.TH;},
 start:n=>startLevel(n),undo:()=>doUndo(),canUndo:()=>canUndo(),sand:()=>{let a=0;for(let c=0;c<NC;c++)if(valid[c])a+=(topY[c]-floorY[c])*DX;return a;},freeze:v=>{FREEZE=!!v;},run:n=>{let v=lastGfx;for(let k=0;k<n;k++){step();v+=1000/60;gfxFrame(v);}},begin:()=>beginPour(),pour:v=>{pouring=!!v;},input:x=>{nozT=x;},release:()=>releaseDecor(),puff:()=>puff(),bot:runBot,levels:LEVELS.length};

// İlk açılış: menü yok, doğrudan 1. bölüm. Sonraki açılışlar raf.
initGfx();resize();
function boot(){setTexts();sndStart();if(!SAVE.seen)startLevel(0);else{startLevel(Math.min(LEVELS.length-1,Object.keys(SAVE.lv).length));openRaf();prevState=null;$('rafClose').style.display='none';}}
// iki kopyadan (tarayıcı deposu, uygulama tercihleri) her bölüm için en iyi sonucu al; biri kaybolsa da ilerleme gitmez
function mergeSave(v){if(!v||typeof v!=='object')return;const lv=Object.assign({},SAVE.lv);for(const k in v.lv||{}){const a=lv[k],b=v.lv[k];if(!b)continue;if(!a){lv[k]=b;continue;}
 lv[k]={p:Math.max(a.p||0,b.p||0),s:Math.max(a.s||0,b.s||0),img:(b.p||0)>(a.p||0)?(b.img||a.img):(a.img||b.img)};}SAVE=Object.assign(SAVE,v,{lv,seen:!!(SAVE.seen||v.seen)});}
if(PLG.Preferences)PLG.Preferences.get({key:SKEY}).then(r=>{if(r&&r.value){try{mergeSave(JSON.parse(r.value));}catch(e){}}}).catch(()=>{}).then(boot);
else boot();
requestAnimationFrame(frame);
</script>
